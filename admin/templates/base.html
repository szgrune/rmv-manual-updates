<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}RMV Manual Updates — Admin{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">RMV Manual Updates · Admin</a>
    <form class="regen" method="post" action="{{ url_for('regenerate') }}">
      <button type="submit" title="Apply all edits to the live site data">
        Regenerate site data
      </button>
    </form>
  </header>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="flashes">
        {% for category, msg in messages %}
          <div class="flash flash-{{ category }}">{{ msg }}</div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
